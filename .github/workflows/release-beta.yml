name: Release web beta

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Protected main commit already deployed by the CI/CD pipeline
        required: true
        default: main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - run: pnpm --filter @moe-ui/cli test
      - run: pnpm --filter @moe-ui/cli build
      - name: Smoke test production deployment and registry
        run: |
          curl --fail --silent --show-error https://moe-ui-docs.vercel.app/ >/dev/null
          curl --fail --silent --show-error https://moe-ui-docs.vercel.app/r/index.json >/dev/null
          curl --fail --silent --show-error https://moe-ui-docs.vercel.app/r/button.json >/dev/null
          curl --fail --silent --show-error https://moe-ui-docs.vercel.app/schema/registry-item.json >/dev/null
      - name: Publish CLI with beta tag
        run: pnpm --filter @moe-ui/cli publish --tag beta --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0-beta.1 --prerelease --target "$GITHUB_SHA" --title "Moe UI v0.1.0-beta.1" --notes-file .github/release-notes-beta.md
